<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Utopia · luggi duc</title>
<!-- pick the theme before anything draws (the same choice as the main page) -->
<script>(function(){var t=null;try{t=localStorage.getItem('duo_theme')}catch(e){}
if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.dataset.theme=t})()</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/utopia.css">
</head>
<body>
<div class="wrap">
  <a class="uback" href="/">← luggi duc</a>
  <h1 class="utitle">Duck Utopia <span>first version</span></h1>
  <p class="sub">Build a duck city with the badges you earn together. Ducks only come from real games; breadcrumbs give them somewhere to live.</p>

  <div class="msg" id="msg"></div>
  <div id="game" class="hidden">
    <div class="uscore" id="scoreboard"></div>
    <div class="srtools"><div class="seg" role="group" aria-label="Whose utopia" id="whose"></div></div>
    <div class="uscene"><canvas id="scene" aria-label="The utopia" role="img"></canvas></div>
    <div class="ures" id="resources"></div>
    <div class="ugrid">
      <section class="panel"><h2>Build</h2><div id="build"></div></section>
      <section class="panel"><h2>Defenders</h2><div id="squad"></div></section>
    </div>
    <section class="panel"><h2>Goose raids</h2><div id="raids"></div></section>
    <section class="panel"><h2>What's happened</h2><div id="log"></div></section>
  </div>
</div>
<div class="ufound hidden" id="founding" role="dialog" aria-modal="true" aria-labelledby="foundTitle"></div>

<script src="/js/utopia-art.js"></script>  <!-- placeholder pixel art (replaced by PNGs in img/utopia/) -->
<script src="/js/utopia.js"></script>      <!-- the page -->
</body>
</html>
