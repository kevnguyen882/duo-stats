<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ducktopia · luggi duc</title>
<!-- pick the theme before anything draws (the same choice as the main page) -->
<script>(function(){var t=null;try{t=localStorage.getItem('duo_theme')}catch(e){}
if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.dataset.theme=t})()</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/utopia.css">
</head>
<body>
<div class="wrap">
  <a class="uback" href="/">← luggi duc</a>
  <h1 class="utitle">Ducktopia <span>first version</span></h1>
  <p class="sub">Build a duck city with the badges you earn together. Spawn ducks in the infirmary; your best games together earn the golden, champion and fire ducks.</p>

  <div class="msg" id="msg"></div>
  <div id="game" class="hidden">
    <div class="uscore" id="scoreboard"></div>
    <div class="srtools"><div class="seg" role="group" aria-label="Whose utopia" id="whose"></div></div>
    <div class="uscene" id="town"><canvas id="scene" aria-label="Ducktopia (click the Duck Infirmary or Penta Plaza to visit them)" role="img"></canvas></div>
    <!-- Penta Plaza takes the scene's place while you visit it -->
    <section class="panel uplaza hidden" id="plaza">
      <div class="uplaza-top"><button class="ghost" data-back>← Back to Ducktopia</button><h2>Penta Plaza</h2></div>
      <div class="uplaza-scene"><canvas id="plazaScene" role="img"></canvas></div><p class="unote" id="plazaNote"></p></section>
    <!-- so does the Duck Infirmary -->
    <section class="panel uplaza ulab hidden" id="lab">
      <div class="uplaza-top"><button class="ghost" data-back>← Back to Ducktopia</button><h2>Duck Infirmary</h2></div>
      <div class="uplaza-scene"><canvas id="labScene" role="img"></canvas></div><p class="unote" id="labNote"></p>
      <div id="labBuild"></div></section>
    <div class="ures" id="resources"></div>
    <div class="ugrid" id="townPanels">   <!-- the main utopia only -->
      <section class="panel"><h2>Build</h2><div id="build"></div></section>
      <section class="panel"><h2>Defenders</h2><div id="squad"></div></section>
    </div>
    <section class="panel"><h2>Goose raids</h2><div id="raids"></div></section>
    <section class="panel"><h2>What's happened</h2><div id="log"></div></section>
  </div>
</div>
<div class="ufound hidden" id="founding" role="dialog" aria-modal="true" aria-labelledby="foundTitle"></div>

<script src="/js/utopia-art.js"></script>  <!-- placeholder pixel art (replaced by PNGs in img/utopia/) -->
<script src="/js/utopia.js"></script>      <!-- the page -->
</body>
</html>
